[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-risk-stress-testing-var"
version = "0.2.0"
description = "Market risk VaR, Expected Shortfall, backtesting, stress testing, and SQL reporting for an Australian bank-style portfolio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "yfinance>=0.2.40",
    "streamlit>=1.36",
    "plotly>=5.22",
    "arch>=7.2",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
market-risk = "market_risk.cli:main"

[tool.setuptools.packages.find]
include = ["market_risk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
